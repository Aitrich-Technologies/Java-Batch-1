<!DOCTYPE html>
<html>
<head>
  <style>
    h1 {
      font-family: Arial, sans-serif;
    }

    .underline {
      text-decoration: underline;
    }

    .bold {
      font-weight: bold;
    }

    .strikethrough {
      text-decoration: line-through;
    }
  </style>
</head>
<body>

<h1 class="underline">Job Provider</h1>
<h1 class="bold">Job Provider</h1>
<h1 class="strikethrough">Job Provider</h1>

</body>
</html>
