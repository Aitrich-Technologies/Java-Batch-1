<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity</title>
</head>

<body>
    <form target="_blank" action="forms.html">
        First Name: <input type="text" name="fname" size="21px" />
        <br><br>
        Last Name: <input type="text" name="lname" size="21px" />
        <br><br>
        Email: <input type="email" name="email" size="25px" />
        <br><br>
        Message:<textarea rows="10" cols="30" name="description"></textarea>
        <br><br>
        <input type="checkbox" value="No">HTML
        <input type="checkbox">CSS
        <input type="checkbox">JavaScript
        <input type="checkbox">Bootstrap
        <br><br>
        <label>Prefered operating sysyem:</label>
        <input type="radio" name="gender" size="100">Windows
        <input type="radio" name="gender" size="100">Linux
        <input type="radio" name="gender" size="100">Mac OS
        <br><br>
        <label>Select Pizza Size</label>
        <br>
        <select name="Pizza size">
            <option value="in" selected>Small</option>
            <option value="in">Medium</option>
            <option value="us">Large</option>
            </select>
            <br><br>
        <label>Select Pizza Crust Type</label>
        <br> 
        <select name="Crust Type">
                <option value="" selected>Deep Dish</option>
                <option value="">New York style pizza</option>
                <option value="software developer">Stuffed crust</option>
                <option value="software developer">Detroit style pizza</option>
                </select>
         <br><br>       
                <input type="reset" value="reset"><br><br><input type="submit">
    </form>
</body>

</html>
