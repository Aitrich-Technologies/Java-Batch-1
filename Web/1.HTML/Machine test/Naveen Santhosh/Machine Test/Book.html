<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now</title>
</head>

<body bgcolor="#88BEDB">
    <font color="#1A385A">
        <h1 align="center">Complete Your details</h1>
        <table align="center" border="1px" cellspacing="0">
            <tr>
                <td>
                    <table align="center" width="50%">
                        <forms>
                            <tr>
                                <td><b>Name:</b><input type="text" name="name" size="80"></td><br>
                            </tr>
                            <tr>
                                <td><br><b>Email:</b><input type="email" name="email" size="80"></td><br>
                            </tr>
                            <tr>
                                <td>
                                    <br><select name="Travel destination:">

                                        <br>
                                        <option value="Destination">London</option>
                                        <option value="Destination">Paris</option>
                                        <option value="Destination">Rome</option>
                                        <option value="Destination">Switzerland</option>
                                    </select>
                                </td><br>
                            </tr>
                            <tr>
                                <td><br><b>Date of Travel:</b>
                                    <input type="date" name="date">
                                </td><br>
                            </tr>
                            <tr></tr>
                            <td><br><b>Number Of Travelers:</b>
                                <input type="number">
                            </td><br>
            </tr>
            <tr>
                <td><br><b>Referred class:</b>
                    <input type="radio" name="gender">Economy
                    <input type="radio" name="gender">Business
                    <input type="radio" name="gender">First
                </td><br>
            </tr>
            <tr>
                <td><br><b>Special requests:</b>
                    <textarea rows="10" cols="30"></textarea>
                </td><br>
            </tr>
            <tr>
                <td><br><input type="checkbox"><b>Terms and conditions</b>
                </td><br>
            </tr>
            <tr>
                <td><br><input type="reset" value="Reset"><input type="button" value="submit"></td>

            </tr>
        </table>
        </forms>
    </font>
    </table>
    </td>
    </tr>
    </table>

</body>

</html>
