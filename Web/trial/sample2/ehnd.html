<input type="text" id="myInput" placeholder="Start typing...">
<p id="displayText"></p>

<script>
    const inputbox = document.getElementById("myInput");
    const disp = document.getElementById("displayText");

    inputbox.addEventListener("input", function() {
        disp.textContent = inputbox.value;
    });


    inputbox.addEventListener("dblclick", function() {
        inputbox.value = "";   
        disp.textContent = ""; 
    });
</script>

</script>
</script>
