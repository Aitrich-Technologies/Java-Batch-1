<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form id="myform" onsubmit="return validateform()">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="Age">Age:</label>
        <input type="text" id="age"><br><br>

        <label for="phonenumber">phone Number:</label>
        <input type="text" id="phone" name="number"><br><br>

       <input type="submit" value="submit" id="submit">

    </form>

    <p id="error" style="color: red;"></p>

    <script>
        function validateform() {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const age = document.getElementById("age").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const errorElement = document.getElementById("error");

            errorElement.innerText = "";
        

        const alphabetRgx = /^[A-Za-z]+$/;
        if (username === "") {
            errorElement.innerText = "Username is required"
            return false;
        }
        else if (!alphabetRgx.test(username)) {
            errorElement.innerText = "Username only contain letters (A-Z or a-z)";
            return false;
        }

        const emailRgx = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRgx.test(email)) {
            errorElement.innerText = "email cannot be empty";
            return false;
        }


        if (age === "" || isNaN(age) || age < 18) {
            errorElement.innerText = "Age must be a number and 18 or older.";
            return false;
        }


        const phoneRgx = /^[0-9]{10}$/;
        if (!phoneRgx.test(phone)) {
            errorElement.innerText = "Phone number must be exactly 10 digits.";
            return false;
        }

        return true;

    }
    </script>
</body>

</html>
