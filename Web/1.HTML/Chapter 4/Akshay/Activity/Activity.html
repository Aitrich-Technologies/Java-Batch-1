<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
</head>
<body>
    <form align="center">
        <b>User name :</b> <input type="text">
        
        <b>Email :</b> <input type="text">
        <br><br>
        <b>Message :</b> <textarea rows="5" cols="50"></textarea><br><br>
        <input type="submit" value="submit">
<br><br>
<label><b>Select your preferred Language :</b><br>
</label>
Java<input type="checkbox"><br>
Flutter<input type="checkbox"><br>
Python<input type="checkbox"><br>
<br>
<label><b>Preferred OS :</b><br>
</label>
Windows<input type="radio"><br>
Linux<input type="radio"><br>
MAC<input type="radio"><br><br>
<input type="submit" value="submit"><br>
<br>
<label>Pizza Size</label><br>
    <select name = "Pizza">
 <option value = "Small">Small</option>
 <option value = "Big">Big</option>
<option value = "Large">Large</option><br>
</select><br><br>
<label>Crust Type</label><br>
<select name = "Crust">
 <option value = "Small">Thin Crust</option>
 <option value = "Big">Thick Crust</option>
<option value = "Large">Cheese Burst</option><br>
</select><br><br>
<label>Select Toppings</label><br>
<select name = "Toppings">
<option value = "#">Mashrooms</option>
<option value = "#">Extra Cheese</option>
<option value = "#">Olives</option><br>
</select><br><br>
<input type="submit" value="submit"><br>

</form>
</body>
</html>
