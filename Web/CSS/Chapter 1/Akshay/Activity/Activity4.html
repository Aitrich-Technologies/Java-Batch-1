<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <style>
    .underline {
        text-decoration: underline;
    }
    .bold {
        font-weight: bold;
    }
    .strikethrough {
        text-decoration: line-through;
    }
    .italic {
        font-style: italic;
    }
        

    </style>
</head>
<body>
    <h1 class="underline">Job Provider</h1>
    <h1 class="bold">Job Provider</h1>
  <h1 class="strikethrough">JobProvider</h1>
  <h1 class="italic">JobProvider</h1>
    
</body>
</html>
