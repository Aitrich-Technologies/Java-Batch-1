<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>count</title>
</head>
<body>
     <div align="center">

    <button id="increment" style="background-color:green" onclick="increment()">Increment</button>
    <button id="decrement" style="background-color: red;" onclick="decrement()">Decrement</button>
    <button id="reset" style="background-color: grey;" onclick="reset()">Reset</button>
    <p>Count: <span id="count" style="background-color: yellow;">0</span></p>
</div>
    <script>
        let count = 0;
        const Display = document.getElementById("count");

        function increment() {
            count++;
            Display.textContent = count;
        }

        function decrement() {
            count--;
            Display.textContent = count;
        }
        function reset() {
            count = 0;
            Display.textContent = count;
        }
    </script>
</body>
</html>
