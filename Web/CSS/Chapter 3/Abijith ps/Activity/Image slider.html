<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS-Only Image Slider</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }

    .slider {
      position: relative;
      width: 600px;
      height: 400px;
      overflow: hidden;
      border: 4px solid #fff;
    }

    .slides {
      display: flex;
      width: 100%;
      height: 100%;
      animation: slide 12s infinite;
    }

    .slide {
      min-width: 100%;
      height: 100%;
      transition: transform 1s ease;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes slide {
      0%   { transform: translateX(0%); }
      25%  { transform: translateX(0%); }
      30%  { transform: translateX(-100%); }
      55%  { transform: translateX(-100%); }
      60%  { transform: translateX(-200%); }
      85%  { transform: translateX(-200%); }
      90%  { transform: translateX(-300%); }
      100% { transform: translateX(-300%); }
    }
  </style>
</head>
<body>

<div class="slider">
  <div class="slides">
    <div class="slide"><img src="https://picsum.photos/id/1015/600/400" alt="Image 1"></div>
    <div class="slide"><img src="https://picsum.photos/id/1016/600/400" alt="Image 2"></div>
    <div class="slide"><img src="https://picsum.photos/id/1018/600/400" alt="Image 3"></div>
    <div class="slide"><img src="https://picsum.photos/id/1019/600/400" alt="Image 4"></div>
  </div>
</div>

</body>
</html>
