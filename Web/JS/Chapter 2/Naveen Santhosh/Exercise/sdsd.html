<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireMe Now!</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #187bcd;
      color: white;
      height: 100vh;
      padding: 20px 0;
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
    }
    .sidebar ul li {
      padding: 12px 20px;
      cursor: pointer;
    }
    .sidebar ul li:hover {
      background: #145a8a;
    }
    .addnew {
      text-align: center;
      margin-top: 30px;
      font-size: 18px;
    }
    /* Content */
    .content {
      flex: 1;
      padding: 20px;
      display: flex;
      justify-content: space-between;
    }
    .table-container {
      flex: 1;
    }
    table {
      border-collapse: collapse;
      width: 90%;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #999;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #f4f4f4;
    }
    /* Right image */
    .image-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-section img {
      max-width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>HireMe Now!</h2>
    <ul>
      <li>Dash Board</li>
      <li>Jobs</li>
      <li>Applications</li>
      <li>Interviews</li>
      <li>Messages</li>
      <li>Settings</li>
    </ul>
    <div class="addnew">
      ➕ AddNew
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Left: Table -->
    <div class="table-container">
      <h2>Interview Schedule</h2>
      <table id="interviewTable">
        <thead>
          <tr>
            <th>Role</th>
            <th>Location</th>
            <th>Date</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data will load here -->
        </tbody>
      </table>
    </div>

    <!-- Right: Image -->
    <div class="image-section">
      <img src="https://cdn.pixabay.com/photo/2016/11/19/14/00/job-1839197_1280.jpg" alt="Interview Image">
    </div>
  </div>

  <script>
    // JS Object Array
    const interviews = [
      { role: "Social Media Assistant", location: "online", date: "16-06-23", time: "10.00 am" },
      { role: "Brand Designer", location: "offline", date: "19-06-23", time: "12.00 pm" },
      { role: "Customer Manager", location: "online", date: "20-06-23", time: "12.00 pm" }
    ];

    // Load data into table
    const tableBody = document.querySelector("#interviewTable tbody");
    interviews.forEach(interview => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${interview.role}</td>
        <td>${interview.location}</td>
        <td>${interview.date}</td>
        <td>${interview.time}</td>
      `;
      tableBody.appendChild(row);
    });
  </script>
</body>
</html>
