<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<style>
    .sidebar {
        background-color: #0F7FBE;
        font-family: 'Times New Roman', Times, serif;
        color: white;
        width: 250px;
        height: 800px;

    }

    .list {
        display: flex;

    }
</style>

<body>
    <table border="2px">
        <tr>
            <td rowspan="3">
                <div class="sidebar">
                    <br><br><br>
                    <h2 align="center">HireMe Now!</h2>
                    <br><br>
                    <ul style="list-style-position: inside; " type="none">
                        <ul type="none">
                            <li class="list"><img src="images/dashboard 1 (1).png" alt="dashboard" width="20px"
                                    height="25px">&nbsp;&nbsp;&nbsp; Dashboard</li><br>
                            <li class="list"><img src="images/suitcase 2.png" alt="all jobs" width="20px"
                                    height="25px">&nbsp;&nbsp;
                                Jobs</li><br>
                            <li class="list"><img src="images/application (1) 1.png" alt="Application" width="20px"
                                    height="25px">&nbsp;&nbsp;&nbsp;Application</li><br>
                            <li class="list"><img src="images/question (1) 1.png" alt="Interviews" width="20px"
                                    height="25px">&nbsp;&nbsp;&nbsp;Interviews</li><br>
                            <li class="list"><img src="images/message 1.png" alt="Messages" width="20px"
                                    height="25px">&nbsp;&nbsp;&nbsp;Messages</li><br>
                            <li class="list"><img src="images/settings 1.png" alt="Settings" width="20px"
                                    height="25px">&nbsp;&nbsp;&nbsp;Settings</li><br>
                            <li><br><br><img src="images/add-group (1) 1.png" alt="AddNew"><br>AddNew</li>
                        </ul>
                    </ul>
                </div>


            </td>
        </tr>
        <tr>
            <td colspan="2" style="width: 1300px; height: 100px;" align="right">
                <div>
                    <img src="images/bell.png" alt="bell" width="30px">
                    <img src="images/olivia-round.png" alt="profile" width="40px">
                    <img src="images/logout (2).png" alt="logout" width="30px">
                </div>
            </td>

        <tr>
            <td  id="content" align="center"><!--inner table js-->


                
            </td>
            <td width="600px">
                <img src="images/employeee.jpg" width="600px" height="700px">
            </td>
        </tr>
        </tr>
    </table>

    <!--Js part-->
    <script>
        var Interviews = [{  role: " Social Media Assistant", Location: " Online", Date: "16-06-23", Time: "10 AM",image:"images/application (1) 1.png"},
        { role: " Brand Designer", Location: " Offline", Date: "19-06-23", Time: "12.00 PM", image:"images/application (1) 1.png" },
        { role: " Custom Manager", Location: " Online", Date: "20-06-23", Time: "12.00 PM", image:"images/application (1) 1.png" }];
         interview();
         function interview(){
            var content=document.getElementById("content");
            for(var i in Interviews){
                var contentTable=document.createElement("table");
             var image=document.createElement("img");
             var role=document.createElement("tr");
             role.style.fontWeight=("bold");
             var Location=document.createElement("tr");
             var Date=document.createElement("tr");
             var Time=document.createElement("tr");
             image.src=Interviews[i].image;
             role.textContent=Interviews[i].role;
             Location.textContent=Interviews[i].Location;
             Date.textContent=Interviews[i].Date;
             Time.textContent=Interviews[i].Time;
             contentTable.appendChild(image);
             contentTable.appendChild(role);
             contentTable.appendChild(Location);
             contentTable.appendChild(Date);
             contentTable.appendChild(Time);
             content.appendChild(contentTable);

            }
         }
    </script>
</body>

</html>
