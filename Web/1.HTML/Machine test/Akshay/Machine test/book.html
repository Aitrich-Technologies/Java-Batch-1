<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking form</title>
</head>
<body>
     <tr>
                <td>
                    <table border="1" align="center" cellpadding="15">
                        <tr>
                            <td colspan="3"><center><h2>Booking page</h2></center>
                                <form>
                                    <label>Name</label><br>
                                    <input type="text" size="30"><br><br>
                                    <label>Email</label><br>
                                     <input type="text" size="30"><br><br>
                                     <label>Travel Destination</label><br>
                                     <select id="destination" name="destination">
                                      <option value="">Select</option>
                                        <option value="paris">Paris</option>
                                        <option value="London">London</option>
                                        <option value="Roma">Roma</option>
                                        </select><br><br>
                                        <label>Date of travel</label>
                                        <input type="date" name="date"><br><br>
                                        <label>Number of Travelers</label><br>
                                        <input type="number"><br><br>
                                        <label>Preferred class</label><br>
                                        <input type="radio" value="Economy">
                                        <label>Economy</label><br>
                                        <input type="radio" value="Business">
                                        <label>Business</label><br>
                                        <input type="radio" value="First">
                                        <label>First</label><br><br>
                                        <label>Special Request</label>
                                        <textarea  name="request"></textarea><br><br>
                                         <input type="checkbox" name="agree">
                                        <label>I agree to the terms and conditions</label><br><br>
                                       <center><input type="submit" value="Submit">
                                        <input type="reset" value="Reset"></center>


                                     </form>

                            </td>
                        </tr>
</body>
</html>
