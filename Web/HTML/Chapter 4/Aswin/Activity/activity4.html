<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity</title>
</head>

<body>
    <h1>Contact Form</h1><br>

    <form>
        User Name: <input type="text">
        <br><br>
        E-mail:<input type="text">
        <br><br>
        Message:</br>
        <textarea rows="5" cols="50" name="Message">
            Enter Message here...
        </textarea><br><br>
        <h2>Select Language</h2><br>
        <input type="checkbox">HTML<br>
        <input type="checkbox">CSS<br>
        <input type="checkbox">JAVASCRIPT<br><br>
        <h2>Preferred OS</h2><br>
        <label>Operating System</label><br>
        <input type="radio" name="OS">Windows
        <input type="radio" name="OS">Linux
        <input type="radio" name="OS">Mac OS
        <br><br>
        <h2>Pizza Ordering</h2>
        <h3>Pizza Size</h3>
        <select name="Pizza Size">
            <option value="Small" selected>Small</option>
            <option value="Medium">Medium</option>
            <option value="XL">XL</option>
        </select>
        <h3>Pizza Crust</h3>
        <select name="Pizza Crust">
            <option value="Flat bread" selected>Flat bread</option>
            <option value="Stuffed" selected>Stuffed </option>
            <option value="Napolitan" selected>Napolitan</option>
        </select>
        <h3>Pizza Toppings</h3>
        <select name="Pizza Toppings">
            <option value="Pepperoni" selected>Pepperoni</option>
            <option value="Cheese" selected>Cheese </option>
            <option value="Mushroom" selected>Mashroom</option>
        </select>
        <br><br>
        <input type="submit" value="Submit">


    </form>

</body>

</html>
